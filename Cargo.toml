[package]
name = "budget"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
directories = "6.0.0"
gpui-kit = "0.7"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", features = ["json"] }
